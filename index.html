<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIT CLUB - Modinagar</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080808;
  color:white;
}

header{
  background:#101010;
  text-align:center;
  padding:20px 10px;
  border-bottom:2px solid #ff7b00;
}

.logo{
  width:170px;
  max-width:75%;
  border-radius:10px;
}

nav{
  margin-top:18px;
}

nav a{
  color:white;
  text-decoration:none;
  margin:0 7px;
  font-size:14px;
}

nav a:hover{
  color:#ff8500;
}

.hero{
  text-align:center;
  padding:80px 20px;
  background:radial-gradient(circle,#292929,#080808 70%);
}

.hero h1{
  font-size:50px;
  color:#ff7b00;
  letter-spacing:3px;
}

.hero p{
  color:#ddd;
  font-size:18px;
  margin-top:10px;
}

.btn{
  display:inline-block;
  margin-top:25px;
  padding:13px 24px;
  background:#ff7b00;
  color:#000;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
}

section{
  max-width:1000px;
  margin:auto;
  padding:55px 15px;
}

.title{
  text-align:center;
  color:#ff7b00;
  font-size:30px;
  margin-bottom:30px;
}

.facilities{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:15px;
}

.facility{
  background:#151515;
  border:1px solid #333;
  border-radius:12px;
  padding:25px 10px;
  text-align:center;
}

.icon{
  font-size:35px;
  margin-bottom:10px;
}

.facility h3{
  font-size:16px;
}

.table-box{
  overflow-x:auto;
}

table{
  width:100%;
  min-width:600px;
  border-collapse:collapse;
  background:#111;
}

th{
  background:#ff7b00;
  color:#000;
  padding:15px;
}

td{
  padding:15px;
  text-align:center;
  border:1px solid #444;
}

td:first-child{
  color:#ffcf00;
  font-weight:bold;
}

.note{
  text-align:center;
  color:#ffcf00;
  font-weight:bold;
  margin-top:20px;
}

.info{
  background:#151515;
  border:1px solid #333;
  border-radius:14px;
  padding:25px;
  text-align:center;
}

.info h3{
  color:#ff7b00;
  margin-bottom:10px;
}

.whatsapp{
  background:#25D366;
  color:white;
}

footer{
  background:#111;
  text-align:center;
