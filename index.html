*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, sans-serif;
    background:#080808;
    color:#fff;
}

/* HEADER */
header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(10,10,10,.96);
    border-bottom:2px solid #ff7b00;
    padding:16px 15px;
    text-align:center;
}

.logo-text{
    font-size:30px;
    font-weight:900;
    color:#ff7b00;
    letter-spacing:3px;
}

.logo-sub{
    color:#aaa;
    font-size:11px;
    letter-spacing:3px;
    margin-top:3px;
}

nav{
    margin-top:14px;
}

nav a{
    color:#fff;
    text-decoration:none;
    font-size:13px;
    margin:0 7px;
}

nav a:hover{
    color:#ff7b00;
}

/* HERO */
.hero{
    min-height:620px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:50px 20px;
    background:
    radial-gradient(circle at center,#303030 0%,#111 38%,#050505 80%);
}

.hero-content{
    max-width:700px;
}

.badge{
    display:inline-block;
    border:1px solid #ff7b00;
    color:#ff7b00;
    padding:8px 15px;
    border-radius:30px;
    font-size:12px;
    letter-spacing:2px;
    margin-bottom:22px;
}

.hero h1{
    font-size:65px;
    font-weight:900;
    color:#ff7b00;
    letter-spacing:5px;
}

.hero h2{
    font-size:25px;
    margin-top:10px;
}

.hero p{
    color:#ccc;
    font-size:17px;
    margin-top:12px;
    line-height:1.6;
}

.buttons{
    margin-top:30px;
}

.btn{
    display:inline-block;
    padding:14px 22px;
    margin:5px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
    color:#000;
    background:#ff7b00;
}

.btn:hover{
    transform:scale(1.03);
}

.btn-outline{
    background:transparent;
    color:#fff;
    border:2px solid #ff7b00;
}

/* SECTIONS */
section{
    max-width:1100px;
    margin:auto;
    padding:70px 18px;
}

.section-title{
    text-align:center;
    font-size:34px;
    color:#ff7b00;
    margin-bottom:12px;
}

.section-subtitle{
    text-align:center;
    color:#999;
    margin-bottom:40px;
}

/* FACILITIES */
.facilities{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:18px;
}

.card{
    background:#151515;
    border:1px solid #333;
    border-radius:15px;
    padding:28px 12px;
    text-align:center;
    transition:.2s;
}

.card:hover{
    border-color:#ff7b00;
    transform:translateY(-4px);
}

.icon{
    font-size:40px;
    margin-bottom:14px;
}

.card h3{
    font-size:16px;
}

.card p{
    color:#999;
    font-size:12px;
    margin-top:8px;
}

/* MEMBERSHIP */

    overflow-x:auto;
}
